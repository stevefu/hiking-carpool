<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hiking Carpool</title>
<style>
 body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f4f6f3;color:#1c2a1e}
 header{background:#2e5d34;color:#fff;padding:16px} header h1{margin:0 0 4px;font-size:22px}
 main{max-width:720px;margin:0 auto;padding:14px}
 .card{background:#fff;border-radius:12px;padding:14px;margin:0 0 14px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
 label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
 input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d2c9;border-radius:8px;font-size:16px;background:#fff}
 button{background:#2e5d34;color:#fff;-webkit-appearance:none;appearance:none;border:0;border-radius:8px;padding:10px 14px;font-size:15px;margin-top:10px}
 button.secondary{background:#e7ede7;color:#1c2a1e} button.danger{background:#a33;color:#fff} button.small{padding:6px 10px;font-size:13px;margin-top:0}
 button:not(.secondary){color:#fff}
 .seats{font-weight:700} .full{color:#a33} .open{color:#2e5d34}
 li{margin:6px 0} .small{font-size:13px;color:#555} .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
 .tag{display:inline-block;background:#e7ede7;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;margin-left:6px}
 .trip{cursor:pointer} .trip h2{margin:0 0 6px} a{color:#2e5d34}
 ul{margin:6px 0;padding-left:20px}
 .sect{margin:20px 2px 10px;font-size:19px}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #e3e9e3;vertical-align:top}
 th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#555}
 .you-name{font-size:22px;font-weight:800}
 select.bigswitch{font-size:18px;font-weight:700;padding:14px;border:2px solid #2e5d34;border-radius:10px;background:#eef4ee}
 button.big{flex:1;padding:16px 10px;font-size:17px;font-weight:700;margin-top:0}
</style></head><body>
<header><h1 id="hdr">🥾 Hiking Carpool</h1><div id="summary">Loading…</div></header>
<main id="app">Loading…</main>
<script>
// One app, three role-isolated pages:
//   /           — hikers: pick your name, choose drive or ride, pick a car
//   /organizer  — trip organizers: fill in trip details + maintain the roster (PIN)
//   /admin      — admins: create and delete trips (PIN)
const MODE = location.pathname.startsWith('/admin') ? 'admin'
           : location.pathname.startsWith('/organizer') ? 'organizer' : 'hiker';
let S={hasAdminPin:false,trips:[]};
let ADMIN_PINS={}; // tripId -> organizer PIN, fetched only when admin-unlocked
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{const v=Number.isFinite(n)?n:40;return '$'+(Number.isInteger(v)?v:v.toFixed(2));};
const adminPin=()=>sessionStorage.getItem('hc2_admin')||'';
const orgPin=tid=>sessionStorage.getItem('hc2_org_'+tid)||'';
const myId=tid=>localStorage.getItem('hc2_me_'+tid)||'';
const hashTripId=()=>{const m=location.hash.match(/^#trip\/([a-f0-9]+)/);return m?m[1]:null;};
// Everyone works inside ONE specific trip, reached by that trip's own link.
const curTid=()=>hashTripId();
const trip=()=>S.trips.find(t=>t.id===curTid())||null;
const hiker=(t,id)=>t.hikers.find(h=>h.id===id);
const carOfDriver=(t,hid)=>t.cars.find(c=>c.driverId===hid);
const carOfPassenger=(t,hid)=>t.cars.find(c=>c.passengerIds.includes(hid));
const me=t=>hiker(t,myId(t.id));

async function api(method,path,body,tid){
 const headers={'Content-Type':'application/json'};
 if(adminPin())headers['X-Admin-Pin']=adminPin();
 const idFor=tid||curTid();
 if(idFor&&orgPin(idFor))headers['X-Organizer-Pin']=orgPin(idFor);
 if(idFor&&myId(idFor))headers['X-Hiker-Id']=myId(idFor);
 const r=await fetch(path,{method,headers,body:body?JSON.stringify(body):undefined});
 const j=await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j;
}
function busy(){const a=document.activeElement;return a&&['INPUT','TEXTAREA','SELECT'].includes(a.tagName);}
let lastSig='';
async function refresh(){try{const n=await api('GET','/api/state',null,'');
 if(MODE==='admin'&&adminPin()){try{const ap=await api('GET','/api/admin/trips',null,'');const m={};(ap.trips||[]).forEach(x=>m[x.id]=x.organizerPin);ADMIN_PINS=m;}catch(e){}}
 const sig=JSON.stringify(n)+'|'+JSON.stringify(ADMIN_PINS);
 if(sig===lastSig)return;if(busy())return;S=n;lastSig=sig;render();}catch(e){}}
function render(){
 $('hdr').textContent = MODE==='admin' ? '🥾 Hiking Carpool — Admin' : MODE==='organizer' ? '🥾 Hiking Carpool — Organizer' : '🥾 Hiking Carpool';
 const t=trip();
 $('summary').textContent = MODE==='admin' ? 'Name trips and hand them to organizers'
  : MODE==='organizer' ? 'Your trip\u2019s details and roster'
  : t ? ([t.title,t.date,t.trailhead].filter(Boolean).join(' · ')||'Trip') : 'One trip per link — open the link for your trip';
 if(MODE==='admin')return renderAdmin();
 if(MODE==='organizer')return renderOrganizer();
 return t?renderTrip(t):renderHome();
}
function statusTag(t,h){
 if(t.organizerId===h.id)return '<span class="tag">Organizer</span>';
 if(h.mode==='driver')return '<span class="tag">Driver 🚗</span>';
 const c=carOfPassenger(t,h.id);
 if(c){const d=hiker(t,c.driverId);return `<span class="tag">Riding with ${esc(d?d.name:'?')}</span>`;}
 if(h.mode==='passenger')return '<span class="tag">Needs a ride</span>';
 return '<span class="tag">Hasn\u2019t chosen yet</span>';
}
function tripStats(t){
 const free=t.cars.reduce((a,c)=>a+Math.max(0,c.seatsTotal-c.passengerIds.length),0);
 const waiting=t.hikers.filter(h=>h.mode!=='driver'&&!carOfPassenger(t,h.id)).length;
 return `${t.hikers.length}${t.maxParticipants?('/'+t.maxParticipants):''} hikers · ${t.cars.length} cars · ${free} seats free · ${waiting} not in a car yet · ${money(t.costPerPassenger)} per passenger`;
}

// ================= HIKER PAGE =================
function renderHome(){
 $('app').innerHTML=`<section class="card"><h2>Open your trip's link</h2>
  <p>This page works on <b>one specific trip</b> at a time, and each trip has its own link — there is no list of trips here.</p>
  <p class="small">Your organizer or admin will send you the link for your trip (it ends in <b>#trip/…</b>). Tap that link and you'll land directly on your trip. Bookmark it for next time.</p></section>`;
}
function renderTrip(t){
 const mine=me(t);
 let h='';
 // Block 1: Hike Info
 h+=`<section class="card"><h2>Hike Info</h2>
  <p style="font-size:18px;margin:4px 0"><b>${esc(t.title)||'Untitled trip'}</b></p>
  <p>${[t.date,t.trailhead].filter(Boolean).map(esc).join(' · ')}</p>
  <p><b>Hike meeting point:</b> ${esc(t.meetingPoint)||'—'}${t.startTime?(' · <b>Start:</b> '+esc(t.startTime)):''}</p>
  <p><b>Cost per passenger:</b> ${money(t.costPerPassenger)} <span class="small">(paid to your driver)</span></p>
  <p class="small">Organized by <b>${esc(t.organizerName)||'—'}</b></p>
  ${t.notes?`<p class="small">${esc(t.notes)}</p>`:''}
  <p><b>${t.hikers.length} ${t.hikers.length===1?'person':'people'} signed up</b>${t.maxParticipants?(' of max '+t.maxParticipants):''} · ${t.cars.length} car${t.cars.length===1?'':'s'}</p></section>`;
 // Block 2: Current user
 h+=currentUserBlock(t,mine);
 // Block 3: My Car info / No ride info
 h+=myCarBlock(t,mine);
 // Block 4: Who's signed up
 h+=`<section class="card"><h2>Who's signed up</h2>${signupTable(t,mine)}</section>`;
 // The shared cars board (passengers claim seats here)
 if(t.cars.length)h+=`<h2 class="sect">Cars on this trip</h2>`+t.cars.map(c=>carCard(t,c,mine)).join('');
 h+='<p class="small">This page refreshes itself every few seconds.</p>';
 $('app').innerHTML=h;
}
function signupTable(t,mine){
 if(!t.hikers.length)return '<p class="small">Nobody has signed up yet.</p>';
 const rows=t.hikers.map(hh=>{
  const ownCar=carOfDriver(t,hh.id), rideCar=carOfPassenger(t,hh.id);
  const role=t.organizerId===hh.id?'Organizer':hh.mode==='driver'?'Driver 🚗':hh.mode==='passenger'?'Passenger 🎒':'Hasn\u2019t chosen';
  let car='—';
  if(ownCar){const free=ownCar.seatsTotal-ownCar.passengerIds.length;car=`Own car · ${ownCar.passengerIds.length}/${ownCar.seatsTotal} seats filled${free?(' · '+free+' free'):''}`;}
  else if(rideCar){const d=hiker(t,rideCar.driverId);car=`Riding with ${esc(d?d.name:'?')}`;}
  else if(hh.mode==='passenger')car='Waiting for a car';
  else if(hh.mode==='driver')car='Driver — no car added yet';
  return `<tr><td><b>${esc(hh.name)}</b>${mine&&mine.id===hh.id?' <span class="tag">you</span>':''}</td><td>${role}</td><td>${car}</td></tr>`;
 }).join('');
 return `<table><tr><th>Hiker</th><th>Role</th><th>Car</th></tr>${rows}</table>`;
}
let switchOpen=false;
function currentUserBlock(t,mine){
 const full=t.maxParticipants&&t.hikers.length>=t.maxParticipants;
 let h=`<section class="card"><h2>Current user</h2>`;
 if(mine){
  h+=`<p class="small" style="margin:0">You are using this page as</p>
   <div class="you-name">${esc(mine.name)}</div>`;
 } else {
  h+=`<p>You haven't picked who you are on this device yet.</p>`;
 }
 h+=`<div class="row">
   <button class="big" onclick="toggleSwitch()">Switch user</button>
   <button class="big secondary" onclick="addMyself('${t.id}')">Add Myself</button>
  </div>
  <div id="switchPanel" ${switchOpen?'':'hidden'}>
   <label>Switch to another user
   <select class="bigswitch" onchange="setMe('${t.id}',this.value)">
   <option value="">— pick who you are —</option>
   ${t.hikers.map(x=>`<option value="${x.id}" ${mine&&mine.id===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
   </select></label>
  </div>`;
 if(!mine&&full)h+=`<p>🚫 This trip is full (max ${t.maxParticipants} participants), so nobody new can be added right now.</p>`;
 if(mine){
  h+=`<div class="row">
    <button class="secondary" onclick="editMyInfo('${t.id}')">Edit my info</button>
    <button class="danger" onclick="removeMyself('${t.id}')">Remove myself</button>
   </div>
   ${roleArea(t,mine)}`;
 }
 return h+'</section>';
}
function toggleSwitch(){switchOpen=!switchOpen;render();}
async function addMyself(tid){
 const t=trip();
 if(t.maxParticipants&&t.hikers.length>=t.maxParticipants)return alert(`This trip is full (max ${t.maxParticipants} participants) — nobody new can be added right now.`);
 const name=prompt('Your name, as it should appear on the roster:');
 if(name===null||!name.trim())return;
 try{const r=await api('POST',`/api/trips/${tid}/join`,{name:name.trim()},tid);S=r;
  if(r.joinedId)localStorage.setItem('hc2_me_'+tid,r.joinedId);
  switchOpen=false;render();alert('Added — you are now using this page as '+name.trim()+'. Next, choose whether you\'re a driver or a passenger.');}catch(e){alert(e.message)}
}
function roleArea(t,mine){
 if(mine.mode==='driver')
  return `<p>Your role: <b>Driver 🚗</b></p><button class="secondary" onclick="setMode('${t.id}','passenger')">Switch to passenger</button>`;
 if(mine.mode==='passenger')
  return `<p>Your role: <b>Passenger 🎒</b></p><button class="secondary" onclick="setMode('${t.id}','driver')">Switch to driver</button>`;
 // No role chosen yet — force the choice before showing any car/ride operations.
 return `<p><b>One more step:</b> are you driving, or riding as a passenger?</p>
  <div class="row">
   <button onclick="setMode('${t.id}','driver')">🚗 I'm a Driver</button>
   <button onclick="setMode('${t.id}','passenger')">🎒 I'm a Passenger</button>
  </div>
  <p class="small">Pick one — you'll only see the controls for that role. You can switch later if your plans change.</p>`;
}
function myCarBlock(t,mine){
 if(!mine)
  return `<section class="card"><h2>No ride info</h2><p class="small">Pick who you are in <b>Current user</b> above, and your car or ride will show up here.</p></section>`;
 const myCar=carOfDriver(t,mine.id), riding=carOfPassenger(t,mine.id);
 if(myCar){
  return `<section class="card"><h2>My Car info</h2>
   <p>🚗 <b>${myCar.passengerIds.length}/${myCar.seatsTotal} seats taken</b> · ${Math.max(0,myCar.seatsTotal-myCar.passengerIds.length)} free<br>
   <b>Meet:</b> ${esc(myCar.meetingPlace)||'—'}${myCar.departureTime?(' at '+esc(myCar.departureTime)):''}</p>
   <p class="small">Each passenger pays you <b>${money(t.costPerPassenger)}</b>.</p>
   ${myCar.notes?`<p class="small">${esc(myCar.notes)}</p>`:''}
   <ul>${myCar.passengerIds.map(pid=>{const x=hiker(t,pid);return `<li><b>${esc(x?x.name:'?')}</b> <button class="small secondary" onclick="assign('${t.id}','${pid}',null)">Remove</button></li>`;}).join('')||'<li class="small">No passengers yet.</li>'}</ul>
   <div class="row"><button class="secondary" onclick="editCar('${t.id}','${myCar.id}')">Update my car</button>
   <button class="danger" onclick="removeCar('${t.id}','${myCar.id}')">Remove my car</button></div>
   <p class="small">Removing your car unassigns your passengers — they are never deleted.</p></section>`;
 }
 if(riding){
  const d=hiker(t,riding.driverId);
  return `<section class="card"><h2>My ride info</h2>
   <p>🎒 You're riding with <b>${esc(d?d.name:'')}</b>.<br>
   <b>Meet:</b> ${esc(riding.meetingPlace)||'—'}${riding.departureTime?(' at '+esc(riding.departureTime)):''}</p>
   <p>You pay your driver <b>${money(t.costPerPassenger)}</b>.</p>
   <button class="secondary" onclick="assign('${t.id}','${mine.id}',null)">Leave that car</button></section>`;
 }
 if(mine.mode==='driver'){
  return `<section class="card"><h2>No ride info</h2>
   <p>You're a <b>driver</b>, but you haven't added your car yet:</p>
   <label>Seats available for passengers <input id="c_seats" type="number" min="1" max="12" value="3"></label>
   <label>Meeting place <input id="c_meeting" placeholder="Where passengers meet you"></label>
   <label>Departure time <input id="c_depart" type="time"></label>
   <label>Notes <input id="c_notes" placeholder="e.g. Blue Subaru, room for packs"></label>
   <button onclick="addCar('${t.id}')">Add my car</button></section>`;
 }
 if(mine.mode==='passenger')
  return `<section class="card"><h2>No ride info</h2><p>You're a <b>passenger</b>, but you're not in a car yet. Pick any car with a free seat in <b>Cars on this trip</b> below and tap “Ride in this car”.</p></section>`;
 return `<section class="card"><h2>No ride info</h2><p class="small">Choose Driver or Passenger in <b>Current user</b> above first.</p></section>`;
}
async function editMyInfo(tid){
 const t=trip();const mine=me(t);if(!mine)return;
 const name=prompt('Your name as it should appear on the roster:',mine.name);
 if(name===null||!name.trim())return;
 try{S=await api('PATCH',`/api/trips/${tid}/hikers/${mine.id}`,{name:name.trim()},tid);render();}catch(e){alert(e.message)}
}
async function removeMyself(tid){
 const t=trip();const mine=me(t);if(!mine)return;
 const driving=carOfDriver(t,mine.id);
 const msg=driving?'Remove yourself from this trip? Your car will be removed too, and your passengers will need to pick a new car.':'Remove yourself from this trip? You can add yourself again later if there is space.';
 if(!confirm(msg))return;
 try{S=await api('DELETE',`/api/trips/${tid}/hikers/${mine.id}`,null,tid);localStorage.removeItem('hc2_me_'+tid);render();}catch(e){alert(e.message)}
}
function carCard(t,c,mine){
 const d=hiker(t,c.driverId), left=c.seatsTotal-c.passengerIds.length;
 const iDrive=mine&&mine.id===c.driverId, iRide=mine&&c.passengerIds.includes(mine.id);
 let h=`<section class="card"><h2>🚗 ${esc(d?d.name:'?')}'s car</h2>
  <p><span class="seats ${left?'open':'full'}">${left?left+' seat'+(left>1?'s':'')+' left':'Full'}</span> · ${c.passengerIds.length}/${c.seatsTotal} passengers</p>
  <p class="small">Each passenger pays the driver <b>${money(t.costPerPassenger)}</b></p>
  <p><b>Meet:</b> ${esc(c.meetingPlace)||'—'}${c.departureTime?(' at <b>'+esc(c.departureTime)+'</b>'):''}</p>
  ${c.notes?`<p class="small">${esc(c.notes)}</p>`:''}
  <ul>${c.passengerIds.map(pid=>{const x=hiker(t,pid);const can=iDrive||(mine&&mine.id===pid);
   return `<li><b>${esc(x?x.name:'?')}</b>${can?` <button class="small secondary" onclick="assign('${t.id}','${pid}',null)">Remove</button>`:''}</li>`;}).join('')||'<li class="small">No passengers yet.</li>'}</ul>`;
 if(mine&&mine.mode==='passenger'&&!iRide&&left>0)h+=`<button onclick="assign('${t.id}','${mine.id}','${c.id}')">Ride in this car</button>`;
 if(iRide)h+=`<button class="secondary" onclick="assign('${t.id}','${mine.id}',null)">Leave this car</button>`;
 if(iDrive)h+=`<div class="row"><button class="secondary" onclick="editCar('${t.id}','${c.id}')">Update meeting place/time</button><button class="danger" onclick="removeCar('${t.id}','${c.id}')">Remove car</button></div>`;
 return h+'</section>';
}
function setMe(tid,hid){if(hid)localStorage.setItem('hc2_me_'+tid,hid);else localStorage.removeItem('hc2_me_'+tid);render();}
async function addCar(tid){const m=me(trip());if(!m)return alert('Pick your name first');try{S=await api('POST',`/api/trips/${tid}/cars`,{driverId:m.id,seatsTotal:$('c_seats').value,meetingPlace:$('c_meeting').value,departureTime:$('c_depart').value,notes:$('c_notes').value},tid);render();}catch(e){alert(e.message)}}
async function editCar(tid,cid){const t=trip();const car=t.cars.find(c=>c.id===cid);const seats=prompt('Seats available for passengers',car.seatsTotal);if(seats===null)return;const place=prompt('Meeting place',car.meetingPlace);if(place===null)return;const time=prompt('Departure time (HH:MM)',car.departureTime||'');if(time===null)return;try{S=await api('PATCH',`/api/trips/${tid}/cars/${cid}`,{seatsTotal:seats,meetingPlace:place,departureTime:time},tid);render();}catch(e){alert(e.message)}}
async function removeCar(tid,cid){if(confirm('Remove this car? Its passengers will become unassigned.')){try{S=await api('DELETE',`/api/trips/${tid}/cars/${cid}`,null,tid);render();}catch(e){alert(e.message)}}}
async function setMode(tid,mode){
 const t=trip();const mine=me(t);
 if(mode==='passenger'&&mine&&carOfDriver(t,mine.id)&&!confirm('Switch to passenger? Your car will be removed and its passengers unassigned.'))return;
 if(mode==='driver'&&mine&&carOfPassenger(t,mine.id)&&!confirm('Switch to driver? You will leave the car you are riding in.'))return;
 try{S=await api('POST',`/api/trips/${tid}/mode`,{hikerId:myId(tid),mode},tid);render();}catch(e){alert(e.message)}
}
async function assign(tid,pid,cid){
 const t=trip();const mine=me(t);
 if(cid&&mine&&carOfDriver(t,mine.id)&&mine.id===pid&&!confirm('You are a driver. Joining this car will remove your own car and unassign your passengers. Continue?'))return;
 try{S=await api('POST',`/api/trips/${tid}/assign`,{passengerId:pid,carId:cid},tid);render();}catch(e){alert(e.message)}
}

// ================= ADMIN PAGE =================
function renderAdmin(){
 let h='';
 if(!S.hasAdminPin){
  h+=`<section class="card"><h2>Set up admin access</h2>
   <p class="small">No Admin PIN exists yet. Whoever sets it up first becomes the admin — pick a PIN and share it only with co-admins.</p>
   <label>Choose an Admin PIN (4+ characters) <input id="a_pin1" type="password"></label>
   <label>Repeat it <input id="a_pin2" type="password"></label>
   <button onclick="setupAdmin()">Set up admin access</button></section>`;
 } else if(!adminPin()){
  h+=`<section class="card"><h2>Admin</h2><label>Admin PIN <input id="a_pin" type="password"></label>
   <button onclick="unlockAdmin()">Unlock admin</button></section>`;
 } else {
  h+=`<section class="card"><h2>Create a trip</h2>
   <p class="small">Admins only name the trip and hand it to an organizer — the organizer fills in all the hike details and the roster on the organizer page.</p>
   <label>Trip name <input id="t_title" placeholder="e.g. Eagle Peak — Saturday"></label>
   <label>Organizer's name <input id="t_org" placeholder="Who will run this trip?"></label>
   <label>Organizer PIN for this trip (give it to the organizer) <input id="t_orgpin" type="text" placeholder="4+ characters"></label>
   <button onclick="createTrip()">Create trip</button></section>`;
  h+='<h2 style="margin:4px 2px">Trips</h2>';
  h+=S.trips.map(t=>`<section class="card"><h2>${esc(t.title)||'Untitled trip'}</h2>
   <p>${[t.date,t.trailhead].filter(Boolean).map(esc).join(' · ')}</p>
   <p class="small">Organized by <b>${esc(t.organizerName)||'—'}</b> · ${tripStats(t)}</p>
   <p class="small">Hiker link — share with the group:<br><a href="/#trip/${t.id}" target="_blank" rel="noopener">${location.origin}/#trip/${t.id}</a></p>
   <p class="small">Organizer link — share only with this trip's organizer:<br><a href="/organizer#trip/${t.id}" target="_blank" rel="noopener">${location.origin}/organizer#trip/${t.id}</a><br>Organizer PIN: <b>${ADMIN_PINS[t.id]?esc(ADMIN_PINS[t.id]):'not recorded for this trip — if it\'s needed here, use “Change organizer” to set a new one'}</b></p>
   <div class="row"><button class="small secondary" onclick="assignOrganizer('${t.id}')">Change organizer</button>
   <button class="small danger" onclick="deleteTrip('${t.id}')">Delete trip</button></div></section>`).join('')||'<section class="card">No trips yet.</section>';
  h+=`<section class="card"><button class="secondary" onclick="lockAdmin()">Lock admin on this device</button></section>`;
 }
 $('app').innerHTML=h;
}
async function setupAdmin(){
 const p1=$('a_pin1').value,p2=$('a_pin2').value;
 if(p1.length<4)return alert('PIN must be at least 4 characters');
 if(p1!==p2)return alert('The two PINs do not match');
 try{await api('POST','/api/admin/setup',{pin:p1},'');sessionStorage.setItem('hc2_admin',p1);S=await api('GET','/api/state',null,'');render();alert('Admin PIN set. You are now unlocked as Admin.');}catch(e){alert(e.message)}
}
async function unlockAdmin(){const pin=$('a_pin').value;try{await api('POST','/api/admin/verify',{pin},'');sessionStorage.setItem('hc2_admin',pin);render();}catch(e){alert(e.message)}}
function lockAdmin(){sessionStorage.removeItem('hc2_admin');ADMIN_PINS={};lastSig='';render();}
async function createTrip(){
 try{S=await api('POST','/api/trips',{title:$('t_title').value,organizerName:$('t_org').value,organizerPin:$('t_orgpin').value},'');render();alert('Trip created. Its hiker and organizer links are on the trip\u2019s card below — send the organizer their link plus the Organizer PIN.');}catch(e){alert(e.message)}
}
async function deleteTrip(tid){if(confirm('Delete this whole trip? This cannot be undone.')){try{S=await api('DELETE',`/api/trips/${tid}`,null,'');render();}catch(e){alert(e.message)}}}
async function assignOrganizer(tid){
 const name=prompt('Organizer\'s name for this trip:');if(name===null)return;
 const pin=prompt('New Organizer PIN for this trip (leave empty to keep the current one):');
 try{S=await api('POST',`/api/trips/${tid}/organizer`,{organizerName:name,organizerPin:pin||undefined},'');render();alert('Organizer updated.');}catch(e){alert(e.message)}
}

// ================= ORGANIZER PAGE =================
function renderOrganizer(){
 let h='';
 const t=trip();
 if(!t){
  $('app').innerHTML=`<section class="card"><h2>Open your trip's organizer link</h2>
   <p>This page works on <b>one specific trip</b> at a time, and each trip has its own organizer link — there is no list of trips here.</p>
   <p class="small">The admin will send you the organizer link for your trip (it's the organizer page address ending in <b>#trip/…</b>). Tap it and you'll land directly on your trip. Bookmark it for next time.</p></section>`;
  return;
 }
 if(!orgPin(t.id)&&!adminPin()){
  h+=`<section class="card"><h2>${esc(t.title)||'Trip'}</h2>
   <p class="small">Enter this trip's Organizer PIN to manage its details and roster. (An Admin PIN also works.)</p>
   <label>Organizer PIN <input id="o_pin" type="password"></label>
   <button onclick="unlockOrg('${t.id}')">Unlock</button></section>`;
  $('app').innerHTML=h;return;
 }
 h+=`<section class="card"><h2>Share with your hikers</h2>
  <p class="small">Send this link to everyone on the trip — it's the hiker page for <b>this trip only</b>:<br>
  <a href="/#trip/${t.id}" target="_blank" rel="noopener">${location.origin}/#trip/${t.id}</a></p></section>
  <section class="card"><h2>${esc(t.title)||'Trip'} — details</h2>
  <label>Trailhead <input id="d_trailhead" value="${esc(t.trailhead)}" placeholder="Trailhead name / address"></label>
  <div class="row"><label style="flex:1">Date <input id="d_date" type="date" value="${esc(t.date)}"></label>
  <label style="flex:1">Hike start time <input id="d_start" type="time" value="${esc(t.startTime)}"></label></div>
  <label>Hike meeting point <input id="d_meet" value="${esc(t.meetingPoint)}" placeholder="Where everyone gathers at the trailhead"></label>
  <label>Notes <textarea id="d_notes" rows="2" placeholder="Bring water, parking pass, etc.">${esc(t.notes)}</textarea></label>
  <label>Maximum participants <input id="d_max" type="number" min="1" max="500" value="${t.maxParticipants??''}" placeholder="Leave blank for no limit"></label>
  <p class="small">A cap, not a quota — the roster never has to fill up to it. Once the trip is full, nobody new can be added.</p>
  <label>Cost per passenger, paid to the driver ($) <input id="d_cost" type="number" min="0" max="10000" step="0.01" value="${Number.isFinite(t.costPerPassenger)?t.costPerPassenger:40}"></label>
  <p class="small">What each passenger pays their driver for the ride. Defaults to $40 — set it to 0 for a free ride.</p>
  <button onclick="saveDetails('${t.id}')">Save trip details</button></section>
  <section class="card"><h2>${esc(t.title)||'Trip'} — roster</h2>
  <p class="small">${[t.date,t.trailhead].filter(Boolean).map(esc).join(' · ')} · ${tripStats(t)}</p>
  <label>New hiker's name <input id="r_name" placeholder="Add a hiker to this trip"></label>
  <button onclick="addHiker('${t.id}')">Add hiker</button></section>
  <section class="card"><h2>Hikers (${t.hikers.length}${t.maxParticipants?(' of max '+t.maxParticipants):''})</h2><ul>
  ${t.hikers.map(x=>`<li><b>${esc(x.name)}</b>${statusTag(t,x)} <button class="small danger" onclick="removeHiker('${t.id}','${x.id}')">Remove</button></li>`).join('')||'<li class="small">No hikers yet.</li>'}
  </ul><p class="small">Removing a driver also removes their car; their passengers become unassigned, never deleted.</p></section>`;
 $('app').innerHTML=h;
}
async function unlockOrg(tid){
 const pin=$('o_pin').value;
 try{await api('PUT',`/api/trips/${tid}/organizer`,{pin},tid);sessionStorage.setItem('hc2_org_'+tid,pin);render();alert('Roster unlocked on this device.');}catch(e){alert(e.message)}
}
async function addHiker(tid){try{S=await api('POST',`/api/trips/${tid}/hikers`,{name:$('r_name').value},tid);render();}catch(e){alert(e.message)}}
async function saveDetails(tid){
 try{S=await api('PATCH',`/api/trips/${tid}`,{trailhead:$('d_trailhead').value,date:$('d_date').value,startTime:$('d_start').value,meetingPoint:$('d_meet').value,notes:$('d_notes').value,maxParticipants:$('d_max').value,costPerPassenger:$('d_cost').value},tid);render();alert('Trip details saved — hikers see them on the main page.');}catch(e){alert(e.message)}
}
async function removeHiker(tid,hid){if(confirm('Remove this hiker from the trip? If they drive, their passengers will become unassigned.')){try{S=await api('DELETE',`/api/trips/${tid}/hikers/${hid}`,null,tid);render();}catch(e){alert(e.message)}}}

window.addEventListener('hashchange',render);
refresh(); setInterval(refresh,5000);
</script></body></html>
